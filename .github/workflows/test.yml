name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e ".[test]"
      - name: Python tests
        run: python -m pytest -q
      - name: Python syntax
        run: python -m compileall -q sourcepilot
      - name: Browser JavaScript syntax
        run: node --check sourcepilot/static/app.js
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build pip-audit
      - name: Dependency audit
        run: python -m pip_audit --disable-pip --no-deps -r requirements.lock
      - name: Build wheel and source archive
        run: python -m build
      - name: Install built wheel
        run: python -m pip install -c requirements.lock dist/*.whl
      - name: Installed command
        run: sourcepilot --version
