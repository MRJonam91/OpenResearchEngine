[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcepilot"
version = "1.0.0"
description = "Local, evidence-first research workspace"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [{name = "MRJonam91"}]
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "pypdf>=6.21.2,<7", "reportlab>=4,<5", "pillow>=13,<14"]

[project.scripts]
sourcepilot = "sourcepilot.__main__:main"

[project.urls]
Repository = "https://github.com/MRJonam91/OpenResearchEngine"
Issues = "https://github.com/MRJonam91/OpenResearchEngine/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
include = ["sourcepilot*"]

[tool.setuptools.package-data]
sourcepilot = ["static/*"]
